[workspace]
resolver = "2"
members = [
    "crates/tpt-l-linux-sandbox-rs",
    "crates/tpt-l-deb-version",
    "crates/tpt-l-control-file",
    "crates/tpt-l-deb-format",
    "crates/tpt-l-dpkg-db",
    "crates/tpt-l-sources-list",
    "crates/tpt-l-apt-config",
    "crates/tpt-l-apt-transport",
    "crates/tpt-l-apt-keyring",
    "crates/tpt-l-apt-solver",
    "crates/tpt-l-maintainer-scripts",
    "crates/tpt-l-dpkg-triggers",
    "crates/tpt-l-deb-diff",
    "crates/tpt-l-apt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-deb-toolkit"
homepage = "https://github.com/tpt-solutions/tpt-deb-toolkit"
documentation = "https://docs.rs/tpt-deb-toolkit"

[workspace.dependencies]
# Internal crates
tpt-l-linux-sandbox-rs = { path = "crates/tpt-l-linux-sandbox-rs" }
tpt-l-deb-version = { path = "crates/tpt-l-deb-version" }
tpt-l-control-file = { path = "crates/tpt-l-control-file" }
tpt-l-deb-format = { path = "crates/tpt-l-deb-format" }
tpt-l-dpkg-db = { path = "crates/tpt-l-dpkg-db" }
tpt-l-sources-list = { path = "crates/tpt-l-sources-list" }
tpt-l-apt-config = { path = "crates/tpt-l-apt-config" }
tpt-l-apt-transport = { path = "crates/tpt-l-apt-transport" }
tpt-l-apt-keyring = { path = "crates/tpt-l-apt-keyring" }
tpt-l-apt-solver = { path = "crates/tpt-l-apt-solver" }
tpt-l-maintainer-scripts = { path = "crates/tpt-l-maintainer-scripts" }
tpt-l-dpkg-triggers = { path = "crates/tpt-l-dpkg-triggers" }
tpt-l-deb-diff = { path = "crates/tpt-l-deb-diff" }

# External crates
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
deb822-lossless = "0.2"
pgp = "0.14"
hex = "0.4"
sha2 = "0.10"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
tar = "0.4"
indicatif = "0.17"
tempfile = "3"
